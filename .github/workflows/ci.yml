name: build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: read go version from go.mod
        id: gomod
        run: |
          version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.gomod.outputs.version }}
          check-latest: true
        id: go

      - name: build and test
        run: |
          go get -v
          # run tests for all packages except examples
          go test $(go list ./... | grep -v /examples/) -timeout=60s -race -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov_tmp
          cat $GITHUB_WORKSPACE/profile.cov_tmp | grep -v "_mock.go" > $GITHUB_WORKSPACE/profile.cov
          go build -race

      - name: test examples
        working-directory: _examples/status
        run: go test -timeout=60s -race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"

      - name: submit coverage
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -service="github" -coverprofile=$GITHUB_WORKSPACE/profile.cov
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}